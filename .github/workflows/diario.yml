name: Radar diário de passagens

on:
  schedule:
    - cron: "7 11 * * *"    # todo dia às 8h (Brasília)
    - cron: "37 13 * * *"   # reserva às 10h30, caso o GitHub pule a das 8h
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Já rodou hoje?
        id: hoje
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "\"data\": \"$(date -u +%F)\"" dados/historico.json 2>/dev/null; then
            echo "Já temos os preços de hoje; pulando a execução reserva."
            echo "pular=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.hoje.outputs.pular != 'true'
        with:
          python-version: "3.12"

      - name: Buscar preços, gerar página e enviar email
        if: steps.hoje.outputs.pular != 'true'
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          EMAIL_USUARIO: ${{ secrets.EMAIL_USUARIO }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          PAGINA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python buscar.py

      - name: Guardar histórico
        if: steps.hoje.outputs.pular != 'true'
        run: |
          git config user.name "radar-passagens"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/historico.json
          git commit -m "Preços de $(date +%F)" || echo "sem mudanças"
          git push

      - uses: actions/configure-pages@v5
        if: steps.hoje.outputs.pular != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.hoje.outputs.pular != 'true'
        with:
          path: site
      - id: deploy
        if: steps.hoje.outputs.pular != 'true'
        uses: actions/deploy-pages@v4
